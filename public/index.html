<!doctype html>
<html lang="ja">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJ10YW8R3Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-GJ10YW8R3Z');
    </script>

    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: ノッチ付き端末でセーフエリアまで描画し、
         下部タブバーやFABがホームインジケーターと重ならないようにする
         (ui-improvements.css 側の env(safe-area-inset-*) とセット)。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AeroSocial</title>
    <meta name="description" content="フライトシミュレーターコミュニティのためのソーシャルネットワーク。フライトログの共有、地震・気象情報、イベントなどをリアルタイムに。" />

    <!-- SNS等でリンクを共有したときの表示。URLは相対パスのままにし、
         どのドメインで配信されても壊れないようにしている。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AeroSocial" />
    <meta property="og:title" content="AeroSocial" />
    <meta property="og:description" content="フライトシミュレーターコミュニティのためのソーシャルネットワーク" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- テーマ(ライト/ダーク)の初期化。CSSより前に、かつ同期的に
         <html>へdata-theme属性を付けることで、保存済みの設定と違う
         テーマで一瞬描画されてしまう(FOUC)のを防いでいる。
         あわせて theme-color メタも初期テーマに同期させる(以前は
         常に暗色固定で、ライトテーマの初回表示だけブラウザの
         ツールバー色が食い違っていた)。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("aerosocial_theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f4f5fa" : "#05070d");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AeroSocial" />

    <link rel="stylesheet" href="/styles.css" />
    <!-- ui-improvements.css は styles.css の「後」に読み込む前提の
         上書き専用シート(アクセシビリティ/タップ領域/セーフエリア等)。
         styles.css 本体は触らず、改善だけをここに集約している。 -->
    <link rel="stylesheet" href="/ui-improvements.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" />
  </head>

      </div>
    </noscript>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/app.js"></script>
