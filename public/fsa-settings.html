<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FSA自動投稿の設定 — AeroSocial</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220; color: #e6edf7;
  }
  .card {
    width: min(420px, 90vw); background: #121a2b; border: 1px solid #223050;
    border-radius: 14px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.desc { color: #9fb0cc; font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #9fb0cc; margin: 12px 0 4px; }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2a3958; background: #0d1626; color: #e6edf7; font-size: 14px;
  }
  button {
    margin-top: 18px; width: 100%; padding: 11px; border-radius: 8px; border: none;
    background: #3b82f6; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .btn-secondary {
    margin-top: 10px; background: #1b2740; color: #e6edf7; border: 1px solid #2a3958;
  }
  .divider {
    display: flex; align-items: center; gap: 10px; margin: 18px 0 0; color: #6b7d9e; font-size: 12px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #223050; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 22px; padding-top: 18px; border-top: 1px solid #223050;
  }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0; background: #2a3958; border-radius: 999px;
    transition: .15s;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: white; border-radius: 50%; transition: .15s;
  }
  input:checked + .slider { background: #22c55e; }
  input:checked + .slider::before { transform: translateX(20px); }
  .msg { font-size: 13px; margin-top: 14px; min-height: 16px; }
  .msg.error { color: #f87171; }
  .msg.ok { color: #4ade80; }
  .hidden { display: none; }
  .logout { background: none; color: #9fb0cc; font-size: 12px; margin-top: 10px; text-decoration: underline; padding: 0; width: auto; }
</style>
</head>
<body>
  <div class="card">
    <h1>FSA自動投稿の設定</h1>
    <p class="desc">
      自分のFSAパイロットIDを登録すると、Flight Stream Assistant（FSA）で
      実際に離陸したタイミングでAeroSocialへ自動投稿されるようになります。
      AeroSocial本体に既にログイン済みの場合は、このページでも自動的に
      ログイン状態になります。
    </p>

    <div id="login-form">
      <button id="google-login-btn" class="btn-secondary">Googleでログイン</button>
      <div class="divider">または</div>
      <label for="callsign">コールサイン</label>
      <input id="callsign" type="text" autocomplete="username" />
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button id="login-btn">ログイン</button>
      <div id="login-msg" class="msg"></div>
    </div>

    <div id="settings-panel" class="hidden">
      <label for="pilot-id">FSAパイロットID</label>
      <input id="pilot-id" type="text" placeholder="例: 12345" autocomplete="off" />
      <button id="pilot-id-save-btn" class="btn-secondary">保存</button>
      <p class="desc" style="margin:10px 0 0;">
        分からない場合は <code>node scripts/resolve-fsa-pilot-id.js</code> を実行して調べてください。
      </p>
      <div id="pilot-id-msg" class="msg"></div>

      <div class="toggle-row">
        <span>離陸を検知したら自動投稿する</span>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </div>
      <div id="settings-msg" class="msg"></div>
      <button class="logout" id="logout-btn">ログアウト</button>
    </div>
  </div>

<script src="/fsa-settings.js"></script>
</body>
</html>
